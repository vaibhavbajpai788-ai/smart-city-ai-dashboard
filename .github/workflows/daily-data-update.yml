name: Refresh daily city data

on:
  schedule:
    # 00:15 UTC daily. GitHub Actions uses UTC; edit this cron if needed.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh daily snapshot
        run: node scripts/refresh-daily-data.mjs

      - name: Validate refreshed JSON
        run: node -e "JSON.parse(require('fs').readFileSync('client/src/data/daily-snapshot.json', 'utf8')); console.log('daily snapshot is valid JSON')"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/daily-snapshot.json
          if git diff --cached --quiet; then
            echo "No daily data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh daily city data"
          git push origin main
